name: Publish aerodrome wind CSV
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '13,43 * * * *'
concurrency:
  group: airport-wind-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read JMA Part 1 and TAF
        run: node publish.mjs public
      - name: Publish CSV and source status
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/feed-state:refs/remotes/origin/feed-state || true
          parent=$(git rev-parse --verify refs/remotes/origin/feed-state 2>/dev/null || true)
          csv=$(git hash-object -w public/wind.csv)
          health=$(git hash-object -w public/health.json)
          tree=$(printf '100644 blob %s\thealth.json\n100644 blob %s\twind.csv\n' "$health" "$csv" | git mktree)
          parents=()
          if [ -n "$parent" ]; then parents=(-p "$parent"); fi
          commit=$(git commit-tree "$tree" "${parents[@]}" -m "Update public aerodrome winds")
          git push origin "$commit:refs/heads/feed-state"
